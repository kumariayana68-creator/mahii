<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="50%" stop-color="#180c24" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Aura Center Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" opacity="0.15" filter="url(#shadow)" />
  
  <!-- Outer Sonic Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#glow)" stroke-width="5" stroke-dasharray="16 8" opacity="0.5" />
  
  <!-- Audio Waves -->
  <path d="M120 256 L150 210 L180 300 L210 180 L240 330 L270 170 L300 320 L330 200 L360 290 L390 256" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />

  <!-- Roxy Emoticon Accent -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">ROXY</text>
  <text x="256" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="6">VOICE AI</text>
</svg>
